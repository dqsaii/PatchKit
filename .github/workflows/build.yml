name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project PatchKit.xcodeproj -scheme PatchKit \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PatchKit.app Payload/
          /usr/bin/zip -r PatchKit-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PatchKit-unsigned-ipa
          path: PatchKit-unsigned.ipa
          retention-days: 14
